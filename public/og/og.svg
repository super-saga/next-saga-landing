<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: emerald/mint gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E9F76"/>
      <stop offset="100%" stop-color="#5FD4AE"/>
    </linearGradient>
    <!-- Soft decorative circle -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9F5E4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9F5E4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BG fill -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow circle -->
  <ellipse cx="820" cy="340" rx="340" ry="280" fill="url(#glow)"/>

  <!-- Sobi mascot silhouette (simplified, centred-right) -->
  <g transform="translate(770, 110)" opacity="0.18" fill="#FFFFFF">
    <!-- Body: friendly rounded bear shape -->
    <ellipse cx="120" cy="230" rx="95" ry="105"/>
    <!-- Head -->
    <circle cx="120" cy="115" r="80"/>
    <!-- Ears -->
    <circle cx="55" cy="50" r="28"/>
    <circle cx="185" cy="50" r="28"/>
    <!-- Inner ears -->
    <circle cx="55" cy="50" r="16" fill="#5FD4AE"/>
    <circle cx="185" cy="50" r="16" fill="#5FD4AE"/>
    <!-- Eyes -->
    <circle cx="95" cy="108" r="10" fill="#06372A"/>
    <circle cx="145" cy="108" r="10" fill="#06372A"/>
    <!-- Eye shine -->
    <circle cx="99" cy="104" r="3.5" fill="#FFFFFF"/>
    <circle cx="149" cy="104" r="3.5" fill="#FFFFFF"/>
    <!-- Muzzle -->
    <ellipse cx="120" cy="132" rx="24" ry="16" fill="#EEFBF5" opacity="0.6"/>
    <!-- Nose -->
    <ellipse cx="120" cy="125" rx="7" ry="5" fill="#06372A"/>
    <!-- Arms -->
    <ellipse cx="30" cy="235" rx="30" ry="18" transform="rotate(-25 30 235)"/>
    <ellipse cx="210" cy="235" rx="30" ry="18" transform="rotate(25 210 235)"/>
    <!-- Legs -->
    <ellipse cx="80" cy="325" rx="28" ry="18"/>
    <ellipse cx="160" cy="325" rx="28" ry="18"/>
  </g>

  <!-- Left accent bar -->
  <rect x="72" y="220" width="6" height="120" rx="3" fill="#FFFFFF" opacity="0.6"/>

  <!-- Wordmark: Sahabat Warga -->
  <text
    x="96"
    y="298"
    font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="-1"
    fill="#FFFFFF">Sahabat Warga</text>

  <!-- Tagline -->
  <text
    x="96"
    y="358"
    font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="500"
    fill="#EEFBF5"
    opacity="0.9">Kelola lingkungan lebih mudah</text>

  <!-- Domain badge -->
  <rect x="96" y="410" width="178" height="40" rx="20" fill="#FFFFFF" opacity="0.2"/>
  <text
    x="185"
    y="436"
    font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    font-weight="600"
    fill="#FFFFFF"
    text-anchor="middle">saga.co.id</text>

  <!-- Bottom-left: emerald chip -->
  <rect x="72" y="560" width="130" height="36" rx="18" fill="#06372A" opacity="0.5"/>
  <text
    x="137"
    y="584"
    font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="15"
    font-weight="600"
    fill="#C9F5E4"
    text-anchor="middle">by Saga</text>
</svg>
